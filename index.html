<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alcohol Control</title>
    <meta name="theme-color" content="#ffffff">
    <style>
        /* Максимальная производительность: системные шрифты, минимум теней */
        :root { --p: #007AFF; --g: #34C759; --r: #FF3B30; --bg: #F2F2F7; --c: #FFFFFF; --t: #000000; --s: #8E8E93; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--t); -webkit-tap-highlight-color: transparent; }
        
        .app { max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--c); box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        header { padding: 15px 20px; border-bottom: 1px solid #E5E5EA; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.9); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(5px); }
        h1 { font-size: 20px; margin: 0; font-weight: 700; }
        .date { font-size: 13px; color: var(--s); font-weight: 500; }

        main { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 80px; }
        
        .card { background: var(--c); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #E5E5EA; }
        .title { font-size: 12px; text-transform: uppercase; color: var(--s); font-weight: 600; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .warn { background: #FFF0F0; border-left: 4px solid var(--r); padding: 10px 12px; font-size: 13px; color: #555; margin-bottom: 15px; border-radius: 0 8px 8px 0; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .box { background: #F9F9F9; padding: 12px; border-radius: 10px; text-align: center; }
        .val { font-size: 22px; font-weight: 700; display: block; margin-bottom: 2px; }
        .lbl { font-size: 11px; color: var(--s); }

        .bar-bg { height: 6px; background: #E5E5EA; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--g); width: 0%; transition: width 0.3s linear; }
        
        .btn { width: 100%; padding: 14px; background: var(--p); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .btn:active { opacity: 0.7; }
        .btn-sec { background: #E5E5EA; color: #000; margin-top: 10px; }

        input, select { width: 100%; padding: 12px; border: 1px solid #E5E5EA; border-radius: 10px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; background: #FAFAFA; }
        input:focus { outline: none; border-color: var(--p); background: #fff; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); border-top: 1px solid #E5E5EA; display: flex; justify-content: space-around; padding: 10px 0 20px; max-width: 500px; margin: 0 auto; z-index: 20; backdrop-filter: blur(10px); }
        .nav-i { flex: 1; text-align: center; font-size: 10px; color: var(--s); cursor: pointer; }
        .nav-i.act { color: var(--p); font-weight: 600; }
        .nav-ic { font-size: 20px; display: block; margin-bottom: 2px; }

        .screen { display: none; }
        .screen.on { display: block; }

        /* Легкий график на CSS */
        .chart { display: flex; align-items: flex-end; justify-content: space-between; height: 100px; padding-top: 10px; border-bottom: 1px solid #eee; margin-bottom: 5px; }
        .col { display: flex; flex-direction: column; align-items: center; width: 12%; }
        .b { width: 8px; background: #E5E5EA; border-radius: 4px; transition: height 0.3s; }
        .b.on { background: var(--p); }
        .d { font-size: 9px; color: var(--s); margin-top: 4px; }

        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .row:last-child { border: none; }
        .act-btn { background: none; border: none; font-size: 12px; padding: 5px; cursor: pointer; }
        .e { color: var(--p); } .d { color: var(--r); }
    </style>
</head>
<body>

<div class="app">
    <header>
        <h1>Alcohol Control</h1>
        <div class="date" id="dt"></div>
    </header>

    <main>
        <!-- DASH -->
        <div id="s1" class="screen on">
            <div class="warn"><b>ВОЗ:</b> Безопасной дозы не существует.</div>
            <div class="card">
                <div class="title">СЕГОДНЯ</div>
                <div class="grid">
                    <div class="box"><span class="val" id="v1">0</span><span class="lbl">Граммов</span></div>
                    <div class="box"><span class="val" id="v2" style="color:var(--g)">0</span><span class="lbl">Дней трезвости</span></div>
                </div>
                <div style="margin-top:15px">
                    <div style="display:flex;justify-content:space-between;font-size:12px;color:#666"><span>Цель: <b id="gl">20</b></span><span id="st">Ост: 20</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="bf"></div></div>
                </div>
            </div>
            <div class="card">
                <div class="title">РИСК (30 ДНЕЙ)</div>
                <div id="risk" style="font-size:13px; padding:5px;"></div>
            </div>
            <button class="btn" onclick="sw('s2')">+ Добавить</button>
        </div>

        <!-- ADD -->
        <div id="s2" class="screen">
            <div class="card">
                <div class="title">ЗАПИСЬ</div>
                <input type="hidden" id="eid">
                <select id="it" onchange="af()"><option value="beer">Пиво (4%)</option><option value="wine">Вино (12%)</option><option value="vodka">Водка (40%)</option><option value="whiskey">Виски (40%)</option><option value="custom">Свое</option></select>
                <input type="number" id="iv" placeholder="Объем (мл)" inputmode="decimal">
                <input type="number" id="ia" placeholder="Крепость (%)" inputmode="decimal">
                <div style="background:#f9f9f9;padding:10px;border-radius:8px;margin-bottom:15px;text-align:right;font-weight:bold" id="cr">0 г</div>
                <button class="btn" onclick="sv()">Сохранить</button>
                <button class="btn btn-sec" onclick="rf()">Отмена</button>
            </div>
        </div>

        <!-- STATS -->
        <div id="s3" class="screen">
            <div class="card">
                <div class="title">ГРАФИК (7 ДНЕЙ)</div>
                <div class="chart" id="ch"></div>
            </div>
            <div class="card">
                <div class="title">ЦИФРЫ</div>
                <div class="row"><span>Среднее</span><b id="sa">0</b></div>
                <div class="row"><span>Максимум</span><b id="sm">0</b></div>
            </div>
        </div>

        <!-- HIST -->
        <div id="s4" class="screen">
            <div class="card" id="hl"><div style="text-align:center;padding:20px;color:#999">Пусто</div></div>
        </div>
    </main>

    <nav>
        <div class="nav-i act" onclick="sw('s1')"><span class="nav-ic">📊</span>Главная</div>
        <div class="nav-i" onclick="sw('s2')"><span class="nav-ic"></span>Добавить</div>
        <div class="nav-i" onclick="sw('s4')"><span class="nav-ic"></span>История</div>
        <div class="nav-i" onclick="sw('s3')"><span class="nav-ic"></span>Стат</div>
    </nav>
</div>

<script>
    const K='alc_fast'; let D={g:20,l:[]};
    window.onload=()=>{
        const s=localStorage.getItem(K); if(s) D=JSON.parse(s);
        document.getElementById('dt').innerText=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
        rd();
        ['iv','ia'].forEach(i=>document.getElementById(i).addEventListener('input',c));
    };
    
    function sv(){ localStorage.setItem(K,JSON.stringify(D)); rd(); }
    
    function sw(id){
        document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
        document.querySelectorAll('.nav-i').forEach(e=>e.classList.remove('act'));
        document.getElementById(id).classList.add('on');
        const m={'s1':0,'s2':1,'s4':2,'s3':3};
        document.querySelectorAll('.nav-i')[m[id]].classList.add('act');
        if(id==='s1') rd(); if(id==='s3') rs(); if(id==='s4') rh(); if(id==='s2'&&!document.getElementById('eid').value) rf();
    }

    function af(){ const m={beer:4,wine:12,vodka:40,whiskey:40,custom:0}; const v=m[document.getElementById('it').value]; if(v) document.getElementById('ia').value=v; c(); }
    function c(){ const v=parseFloat(document.getElementById('iv').value)||0; const a=parseFloat(document.getElementById('ia').value)||0; document.getElementById('cr').innerText=(v*a*0.00789).toFixed(1)+' г'; }
    
    function sv(){
        const v=parseFloat(document.getElementById('iv').value), a=parseFloat(document.getElementById('ia').value);
        if(!v||!a) return alert('Заполните поля');
        const g=v*a*0.00789, n=new Date(), id=document.getElementById('eid').value;
        const t=document.getElementById('it').options[document.getElementById('it').selectedIndex].text.split(' ')[0];
        const e={id:id?parseInt(id):Date.now(), d:n.toISOString().split('T')[0], t:n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}), ty:t, v, a, g};
        if(id){ const i=D.l.findIndex(x=>x.id==id); if(i>-1) D.l[i]=e; } else D.l.push(e);
        sv(); rf(); sw('s1');
    }
    
    function rf(){ document.getElementById('eid').value=''; document.getElementById('iv').value=''; document.getElementById('ia').value=''; document.getElementById('cr').innerText='0 г'; }
    
    function ed(id){
        const l=D.l.find(x=>x.id==id); if(!l) return;
        document.getElementById('eid').value=l.id; document.getElementById('iv').value=l.v; document.getElementById('ia').value=l.a; c(); sw('s2');
    }
    
    function dl(id){ if(confirm('Удалить?')){ D.l=D.l.filter(x=>x.id!=id); sv(); rh(); } }
    
    function rd(){
        const td=new Date().toISOString().split('T')[0];
        const sm=D.l.filter(l=>l.d===td).reduce((s,l)=>s+l.g,0);
        document.getElementById('v1').innerText=sm.toFixed(1);
        document.getElementById('gl').innerText=D.g;
        
        const bf=document.getElementById('bf'), st=document.getElementById('st');
        const pct=Math.min((sm/D.g)*100,100);
        bf.style.width=pct+'%'; bf.style.background=sm>D.g?'var(--r)':'var(--g)';
        st.innerText=sm>D.g?`Превышено на ${Math.round(((sm-D.g)/D.g)*100)}%`:`Ост: ${(D.g-sm).toFixed(1)}`;
        
        // Streak
        let str=0; const ds=[...new Set(D.l.map(l=>l.d))].sort().reverse();
        if(ds.length&&ds[0]===td) str=0; else { str=1; let d=new Date(); d.setDate(d.getDate()-1); while(true){ if(ds.includes(d.toISOString().split('T')[0])) break; str++; d.setDate(d.getDate()-1); } }
        document.getElementById('v2').innerText=str;
        
        // Risk
        const d30=new Date(); d30.setDate(d30.getDate()-30);
        const avg=D.l.filter(l=>new Date(l.d)>=d30).reduce((s,l)=>s+l.g,0)/30;
        const rb=document.getElementById('risk');
        if(avg>40) rb.innerHTML='<span style="color:var(--r);font-weight:bold">ВЫСОКИЙ РИСК</span><br>Цирроз, Инсульт';
        else if(avg>20) rb.innerHTML='<span style="color:orange;font-weight:bold">СРЕДНИЙ РИСК</span><br>Печень, Давление';
        else rb.innerHTML='<span style="color:var(--g);font-weight:bold">НИЗКИЙ РИСК</span><br>Минимальное влияние';
    }
    
    function rh(){
        const l=document.getElementById('hl');
        if(!D.l.length){ l.innerHTML='<div style="text-align:center;padding:20px;color:#999">Пусто</div>'; return; }
        l.innerHTML=D.l.slice().reverse().map(x=>`<div class="row"><div><div style="font-weight:500">${x.ty}</div><div style="font-size:11px;color:#888">${x.d} ${x.t}</div></div><div style="text-align:right"><div style="font-weight:bold">${x.g.toFixed(1)} г</div><button class="act-btn e" onclick="ed(${x.id})">Изм</button> <button class="act-btn d" onclick="dl(${x.id})">Уд</button></div></div>`).join('');
    }
    
    function rs(){
        const ch=document.getElementById('ch'); ch.innerHTML='';
        let mx=10; const vs=[];
        for(let i=6;i>=0;i--){
            const d=new Date(); d.setDate(d.getDate()-i);
            const ds=d.toISOString().split('T')[0];
            const v=D.l.filter(l=>l.d===ds).reduce((s,l)=>s+l.g,0);
            vs.push(v); if(v>mx) mx=v;
        }
        vs.forEach((v,i)=>{
            const h=(v/mx)*80;
            const col=document.createElement('div'); col.className='col';
            col.innerHTML=`<div class="b ${v>0?'on':''}" style="height:${h}px"></div><div class="d">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(new Date().setDate(new Date().getDate()-(6-i))).getDay()]}</div>`;
            ch.appendChild(col);
        });
        const tot=vs.reduce((a,b)=>a+b,0);
        document.getElementById('sa').innerText=(tot/7).toFixed(1)+' г';
        document.getElementById('sm').innerText=Math.max(...vs).toFixed(1)+' г';
    }
</script>
</body>
</html>
